name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CONTACT_EMAIL: contact@shikshagap.in
      NEXT_PUBLIC_SITE_URL: https://shikshagap.vercel.app
      SESSION_SECRET: dummy_session_secret_for_ci_testing_32chars
      IP_SALT: dummy_salt_for_ci_testing_purposes
      CRON_SECRET: dummy_cron_secret_for_ci_testing
      DATABASE_URL: ""
      GEMINI_API_KEY: ""
      GEMINI_MODEL: gemini-2.5-flash
      NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy_anon_key_for_ci_testing
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build project
        run: npm run build
