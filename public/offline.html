<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline | ShikshaGap</title>
  <style>
    body {
      background-color: #FAF8E8;
      color: #432623;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }
    .card {
      border: 1px solid rgba(67, 38, 35, 0.25);
      background: #FAF8E8;
      padding: 32px;
      max-width: 480px;
      width: 100%;
      border-radius: 2px;
    }
    .tag {
      font-size: 11px;
      font-family: monospace;
      text-transform: uppercase;
      color: #DE2A35;
      font-weight: bold;
      margin-bottom: 8px;
    }
    h1 {
      font-size: 24px;
      margin: 0 0 12px 0;
      font-weight: normal;
    }
    p {
      font-size: 13px;
      line-height: 1.6;
      margin: 0 0 20px 0;
      color: rgba(67, 38, 35, 0.85);
    }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: #432623;
      color: #F5F1BC;
      font-family: monospace;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
      text-decoration: none;
      border: 1px solid #432623;
      border-radius: 2px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="tag">Network Disconnected</div>
    <h1>Working in Offline Mode</h1>
    <p>
      Your device currently has no internet connection. Cached diagnostic tools and previously loaded classroom records remain accessible. Any new assessment notes or teacher overrides will be queued securely and synchronized as soon as connectivity resumes.
    </p>
    <button class="btn" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
